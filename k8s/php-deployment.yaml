apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplewatch-php
  namespace: simplewatch
spec:
  replicas: 2  # ← 2 pod (high availability)
  selector:
    matchLabels:
      app: simplewatch-php
  template:
    metadata:
      labels:
        app: simplewatch-php
    spec:
      containers:
      - name: php
        image: mesuttunga/simplewatch:v1.0
        ports:
        - containerPort: 80
        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: simplewatch-config
              key: APP_NAME
        - name: CHECK_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: simplewatch-config
              key: CHECK_INTERVAL
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: simplewatch-config
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: simplewatch-secret
              key: DB_PASSWORD
        # Liveness Probe: Pod çalışıyor mu?
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30  # ← 30 saniye bekle (başlama süresi)
          periodSeconds: 10        # ← Her 10 saniyede kontrol et
          timeoutSeconds: 5        # ← 5 saniye timeout
          failureThreshold: 3      # ← 3 kez başarısız → Pod'u RESTART et
        # Readiness Probe: Pod trafiği alabilir mi?
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10  # ← 10 saniye bekle
          periodSeconds: 5         # ← Her 5 saniyede kontrol et
          timeoutSeconds: 3
          failureThreshold: 3      # ← 3 kez başarısız → Trafik GÖNDERME
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

